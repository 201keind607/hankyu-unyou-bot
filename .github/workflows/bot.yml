name: Hankyu Unyou Bot

on:
  schedule:
    - cron: "0 22 * * 1-5"   # 平日 7:00(JST)
    - cron: "0 3 * * 1-5"    # 平日 12:00(JST)
    - cron: "0 8 * * 1-5"    # 平日 17:00(JST)

  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: Pythonをセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: ライブラリをインストール
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Bot実行
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: python bot.py
