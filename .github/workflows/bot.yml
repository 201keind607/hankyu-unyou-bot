name: Hankyu Unyou Bot v2

on:
  schedule:
    - cron: "*/5 * * * *"

  workflow_dispatch:


jobs:
  run:

    runs-on: ubuntu-latest


    steps:

      # ==========================================
      # リポジトリ取得
      # ==========================================

      - name: リポジトリを取得
        uses: actions/checkout@v4


      # ==========================================
      # Python設定
      # ==========================================

      - name: Pythonをセットアップ
        uses: actions/setup-python@v5

        with:
          python-version: "3.13"


      # ==========================================
      # ライブラリ
      # ==========================================

      - name: ライブラリをインストール

        run: |
          python -m pip install --upgrade pip
          pip install requests


      # ==========================================
      # Bot実行
      # ==========================================

      - name: Bot実行

        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}

        run: python main.py
